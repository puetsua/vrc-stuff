<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{LISTING_NAME}}</title>
  <link rel="stylesheet" href="../styles.css" />
  <script type="module" src="https://unpkg.com/@fluentui/web-components"></script>
  <style>
    /* Listing-specific overrides: keep page-overlay shape from portal,
       but anchor content to the top and darken the overlay for readability. */
    .page-overlay {
      align-items: flex-start;
      padding: 0;
      background: linear-gradient(to right, rgba(0, 0, 0, 0.78), rgba(0, 0, 0, 0.6));
    }
  </style>
</head>
<body>
  <main class="page" style="background-image: url('bg2.png');">
    <div class="page-overlay">
      <div class="listing-content">
        <div class="back-row">
          <a class="btn btn-icon" href="../" aria-label="Back to portal">&larr;</a>
        </div>
        <header class="listing-header">
          <h1>{{LISTING_NAME}}</h1>
          <p>{{LISTING_DESCRIPTION}}</p>
          <div class="add-vcc-row">
            <a class="btn" href="vcc://vpm/addRepo?url={{LISTING_URL}}">Add to VCC</a>
            <input class="vpm-url" type="text" readonly value="{{LISTING_URL}}" onclick="this.select()" />
          </div>
        </header>
        <main>
          {{PACKAGE_ROWS}}
        </main>
        <footer>
          Maintained by <a href="{{AUTHOR_URL}}" rel="noopener noreferrer" target="_blank">{{AUTHOR_NAME}}</a>.
        </footer>
      </div>
    </div>
  </main>
</body>
</html>
