<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{LISTING_NAME}}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23805AD5'/><text x='50' y='70' font-size='62' text-anchor='middle' fill='white' font-family='Segoe UI,sans-serif' font-weight='700'>P</text></svg>" />
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <main class="page" style="background-image: url('bg2.png');">
    <div class="page-overlay listing-overlay">
      <div class="listing-content">
        <div class="back-row">
          <a class="btn btn-icon" href="../" aria-label="Back to portal">&larr;</a>
        </div>
        <header class="listing-header">
          <h1>{{LISTING_NAME}}</h1>
          <p>{{LISTING_DESCRIPTION}}</p>
          <div class="add-vcc-row">
            <a class="btn" href="vcc://vpm/addRepo?url={{LISTING_URL}}">Add to VCC</a>
            <input class="vpm-url" type="text" readonly value="{{LISTING_URL}}" onclick="this.select()" />
          </div>
        </header>
        <section class="package-list">
          {{PACKAGE_ROWS}}
        </section>
        <footer>
          Maintained by <a href="{{AUTHOR_URL}}" rel="noopener noreferrer" target="_blank">{{AUTHOR_NAME}}</a>.
        </footer>
      </div>
    </div>
  </main>
</body>
</html>
